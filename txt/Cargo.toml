[workspace]
resolver = "2"
members = [
    "crates/txt-core",
    "crates/txt-cli",
    "crates/txt-render-typst",
    "crates/txt-render-html",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/geonot/texture"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
